name: Java CI with Gradle

on:
  workflow_dispatch:

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          distribution: zulu
          expander_leg: macos-latest--arm64
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 1.8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: ${{ matrix.distribution }}
        cache: 'gradle'
    - name: Build dex-tools with Gradle
      run: |
        ./gradlew "-DGITHUB_REF_NAME=${GITHUB_REF_NAME}" check distZip

    - name: Archive dex tools
      uses: actions/upload-artifact@v3
      if: success()
      with:
        name: dex-tools
        path: dex-tools/build/distributions/dex-tools-*.zip
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
